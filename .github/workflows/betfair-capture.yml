name: Betfair capture

# Captura cuotas reales del Betfair Exchange para validar (paper trading) las
# estrategias de tennis (lay favorito en Masters 1000) y fútbol (Lay the Draw:
# Mundial ahora + ligas al reiniciar) y PUBLICA el resultado como JSON para el
# dashboard (betfair.html). SOLO LEE de Betfair; nunca coloca apuestas.
#
# IMPORTANTE:
#   1. Para que el `schedule` (cron) dispare, este archivo debe estar en la rama
#      por defecto (main). En una rama de feature usa "Run workflow" (manual).
#   2. Secrets requeridos: BETFAIR_APP_KEY, BETFAIR_USERNAME, BETFAIR_PASSWORD.
#      Opcionales (cert): BETFAIR_CERT_B64, BETFAIR_KEY_B64 (el .crt/.key en base64).
#   3. Corre cada 20 min todo el año; cada captura no hace nada si no hay partidos
#      de su filtro (tennis = Masters; fútbol = Mundial + ligas top).

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

concurrency:
  group: betfair-capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r betfair/requirements.txt

      - name: Preparar certificado (si está configurado)
        env:
          BETFAIR_CERT_B64: ${{ secrets.BETFAIR_CERT_B64 }}
          BETFAIR_KEY_B64: ${{ secrets.BETFAIR_KEY_B64 }}
        run: |
          if [ -n "$BETFAIR_CERT_B64" ] && [ -n "$BETFAIR_KEY_B64" ]; then
            echo "$BETFAIR_CERT_B64" | base64 -d > "$RUNNER_TEMP/bf.crt"
            echo "$BETFAIR_KEY_B64"  | base64 -d > "$RUNNER_TEMP/bf.key"
            echo "BETFAIR_CERT_FILE=$RUNNER_TEMP/bf.crt" >> "$GITHUB_ENV"
            echo "BETFAIR_KEY_FILE=$RUNNER_TEMP/bf.key"  >> "$GITHUB_ENV"
            echo "Login por certificado habilitado."
          else
            echo "Sin certificado; se usará login interactivo (usuario/clave)."
          fi

      - name: Capturar, liquidar y exportar JSON (tennis + fútbol)
        env:
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
        run: |
          for sport in tennis football; do
            python3 -m betfair.capture.capture record --sport $sport
            python3 -m betfair.capture.capture settle --sport $sport
          done
          python3 -m betfair.capture.export_json --sport tennis \
            --in betfair/data/masters_capture.csv --out betfair/data/masters.json
          python3 -m betfair.capture.export_json --sport football \
            --in betfair/data/football_capture.csv --out betfair/data/football.json

      - name: Publicar datos para el dashboard
        run: |
          git config user.name "betfair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add betfair/data
          if git diff --cached --quiet; then
            echo "sin cambios que publicar"
          else
            git commit -m "betfair: actualizar capturas y JSON [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Subir CSVs como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betfair-capture
          path: betfair/data/*_capture.csv
          if-no-files-found: ignore
          retention-days: 90
