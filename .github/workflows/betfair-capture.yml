name: Betfair Masters capture

# Captura cuotas de cierre del Betfair Exchange para validar (paper trading) la
# estrategia "lay al favorito en Masters 1000". SOLO LEE; nunca coloca apuestas.
#
# IMPORTANTE:
#   1. Para que el `schedule` (cron) dispare, este archivo debe estar en la rama
#      por defecto (main). En una rama de feature no se programa solo; usa
#      "Run workflow" (workflow_dispatch) para probarlo manualmente.
#   2. Configura los Secrets del repo: BETFAIR_APP_KEY, BETFAIR_USERNAME,
#      BETFAIR_PASSWORD. Opcionales (login por certificado, recomendado):
#      BETFAIR_CERT_B64, BETFAIR_KEY_B64 (el .crt/.key en base64).
#   3. El cron está limitado a los meses con Masters 1000 (mar, abr, may, ago,
#      oct, nov). Fuera de esas fechas el capturador simplemente no encuentra
#      mercados y no hace nada.

on:
  workflow_dispatch:
  schedule:
    # cada 15 min, sólo en meses de Masters 1000 (UTC)
    - cron: "*/15 * * 3,4,5,8,10,11 *"

# Evita solapes entre corridas (la persistencia es un único CSV en caché)
concurrency:
  group: betfair-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r betfair/requirements.txt

      # Persiste el CSV entre corridas: restaura el más reciente y guarda uno nuevo
      - name: Restaurar capturas previas
        uses: actions/cache@v4
        with:
          path: betfair/capture/masters_capture.csv
          key: masters-capture-${{ github.run_id }}
          restore-keys: |
            masters-capture-

      - name: Preparar certificado (si está configurado)
        env:
          BETFAIR_CERT_B64: ${{ secrets.BETFAIR_CERT_B64 }}
          BETFAIR_KEY_B64: ${{ secrets.BETFAIR_KEY_B64 }}
        run: |
          if [ -n "$BETFAIR_CERT_B64" ] && [ -n "$BETFAIR_KEY_B64" ]; then
            echo "$BETFAIR_CERT_B64" | base64 -d > "$RUNNER_TEMP/bf.crt"
            echo "$BETFAIR_KEY_B64"  | base64 -d > "$RUNNER_TEMP/bf.key"
            echo "BETFAIR_CERT_FILE=$RUNNER_TEMP/bf.crt" >> "$GITHUB_ENV"
            echo "BETFAIR_KEY_FILE=$RUNNER_TEMP/bf.key"  >> "$GITHUB_ENV"
            echo "Login por certificado habilitado."
          else
            echo "Sin certificado; se usará login interactivo (usuario/clave)."
          fi

      - name: Capturar y liquidar
        env:
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
        run: |
          python3 -m betfair.capture.capture_masters record --within-min 20
          python3 -m betfair.capture.capture_masters settle

      - name: Subir CSV como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masters-capture
          path: betfair/capture/masters_capture.csv
          if-no-files-found: ignore
          retention-days: 90
